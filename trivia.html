<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Trivia — Sabres</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .trivia-wrap {
      max-width: 600px;
      margin: 0 auto;
    }
    .trivia-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.5rem 2rem;
    }
    .trivia-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    #trivia-counter {
      font-size: .85rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    #trivia-question {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 1.75rem;
      color: var(--text);
    }
    #trivia-options {
      display: flex;
      flex-direction: column;
      gap: .75rem;
      margin-bottom: 1.5rem;
    }
    .trivia-option {
      width: 100%;
      text-align: left;
      padding: .85rem 1.1rem;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--bg);
      font-size: .95rem;
      color: var(--text);
      font-weight: 500;
      transition: border-color .15s, background .15s;
    }
    .trivia-option:hover:not(:disabled) {
      border-color: var(--green);
      background: var(--green-light);
    }
    .trivia-option.correct {
      border-color: var(--green-dark);
      background: var(--green-light);
      color: var(--green-dark);
      font-weight: 700;
    }
    .trivia-option.correct::after { content: ' ✓'; }
    .trivia-option.wrong {
      border-color: #e57373;
      background: #fdecea;
      color: #c62828;
    }
    .trivia-option.wrong::after { content: ' ✗'; }
    #trivia-explanation {
      background: var(--green-light);
      border-left: 4px solid var(--green-dark);
      border-radius: 8px;
      padding: .85rem 1rem;
      font-size: .9rem;
      color: var(--text);
      line-height: 1.55;
      margin-bottom: 1.25rem;
    }
    #trivia-next {
      width: 100%;
      justify-content: center;
      font-size: 1rem;
      padding: .75rem;
    }
    .trivia-progress {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 1.75rem;
    }
    .trivia-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--orange));
      border-radius: 99px;
      transition: width .4s ease;
    }

    /* ── Results screen ── */
    #trivia-results {
      display: none;
      text-align: center;
      padding: 1rem 0 .5rem;
    }
    .result-emoji { font-size: 3.5rem; line-height: 1; margin-bottom: 1rem; }
    .result-score {
      font-size: 3rem;
      font-weight: 900;
      color: var(--green-dark);
      margin-bottom: .3rem;
    }
    .result-label {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: .5rem;
    }
    .result-msg {
      color: var(--text-muted);
      font-size: .95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }
    .result-breakdown {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1.75rem;
    }
    .result-stat { text-align: center; }
    .result-stat-num { font-size: 1.6rem; font-weight: 900; }
    .result-stat-num.correct { color: var(--green-dark); }
    .result-stat-num.wrong   { color: #e57373; }
    .result-stat-lbl { font-size: .8rem; color: var(--text-muted); margin-top: .15rem; }
  </style>
</head>
<body>

<nav class="nav" role="navigation" aria-label="Main navigation">
  <a href="index.html" class="nav-logo">🌿 Sabres<span>.</span></a>
  <button class="nav-hamburger" aria-label="Open menu">☰</button>
  <ul class="nav-links" role="list">
    <li><a href="dictionary.html">📖 Dictionary</a></li>
    <li><a href="trivia.html" class="active">🧠 Trivia</a></li>
    <li><a href="community.html">💬 Community</a></li>
    <li><a href="playlist.html">🎵 Playlist</a></li>
  </ul>
</nav>

<main class="page">
  <div style="max-width:600px;margin:0 auto 2rem;">
    <h1 class="section-title">🧠 Daily Trivia</h1>
    <p class="section-subtitle">Test your Hebrew & Israeli culture knowledge</p>
  </div>

  <div class="trivia-wrap">
    <div class="trivia-card">
      <div class="trivia-meta">
        <span class="tag">🗣️ Israeli Slang</span>
        <span id="trivia-counter">Question 1 of 7</span>
      </div>

      <div class="trivia-progress" role="progressbar" aria-label="Quiz progress">
        <div class="trivia-progress-bar" id="trivia-bar" style="width:14%"></div>
      </div>

      <p id="trivia-question"></p>

      <div id="trivia-options" role="group" aria-label="Answer options"></div>

      <div id="trivia-explanation" style="display:none" aria-live="polite"></div>

      <button
        id="trivia-next"
        class="btn btn-green"
        style="display:none"
        onclick="nextTrivia()"
        aria-label="Next question"
      >Next Question →</button>

      <!-- Results screen (shown after last question) -->
      <div id="trivia-results" aria-live="polite">
        <div class="result-emoji" id="result-emoji">🎉</div>
        <div class="result-score" id="result-score">0/7</div>
        <div class="result-label" id="result-label"></div>
        <p class="result-msg" id="result-msg"></p>
        <div class="result-breakdown">
          <div class="result-stat">
            <div class="result-stat-num correct" id="result-correct">0</div>
            <div class="result-stat-lbl">Correct</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num wrong" id="result-wrong">0</div>
            <div class="result-stat-lbl">Incorrect</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num" id="result-pct" style="color:var(--orange-dark)">0%</div>
            <div class="result-stat-lbl">Score</div>
          </div>
        </div>
        <button class="btn btn-green" onclick="restartTrivia()" style="width:100%;justify-content:center;font-size:1rem;padding:.8rem">
          🔄 Try Again
        </button>
      </div>
    </div>
  </div>
</main>

<footer>
  <strong>Sabres</strong> — Built for new Israelis &nbsp;·&nbsp; Learn the language, feel the culture 🌿
</footer>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
